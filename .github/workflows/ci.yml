name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # 22.04: the in-memory MongoDB used by the tests is pinned to 7.0, which ships Ubuntu 22.04 binaries.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache MongoDB test binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-7.0.14
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
